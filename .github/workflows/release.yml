name: Release Builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  LIBOQS_VERSION: "0.13.0"

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          targets: x86_64-unknown-linux-musl

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake ninja-build clang

      - name: Cache liboqs
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: /tmp/liboqs-install
          key: liboqs-${{ env.LIBOQS_VERSION }}-linux-musl-v3

      - name: Build and install liboqs
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          # Build OpenSSL for musl
          wget -q https://www.openssl.org/source/openssl-3.0.15.tar.gz
          tar xzf openssl-3.0.15.tar.gz
          cd openssl-3.0.15
          CC=musl-gcc ./config no-shared --prefix=/tmp/openssl-musl
          make -j$(nproc)
          make install_sw
          cd ..

          # Build liboqs
          git clone --depth 1 --branch ${{ env.LIBOQS_VERSION }} https://github.com/open-quantum-safe/liboqs.git
          cd liboqs
          mkdir build && cd build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DOQS_USE_OPENSSL=ON \
            -DOPENSSL_ROOT_DIR=/tmp/openssl-musl \
            -DCMAKE_INSTALL_PREFIX=/tmp/liboqs-install \
            -DCMAKE_C_COMPILER=musl-gcc \
            -DCMAKE_C_FLAGS="-static" \
            ..
          ninja
          ninja install

      - name: Build pqenc
        env:
          OPENSSL_STATIC: "1"
          OPENSSL_DIR: /tmp/openssl-musl
          OQS_DIR: /tmp/liboqs-install
          RUSTFLAGS: "-C target-feature=+crt-static -L /tmp/liboqs-install/lib -L /tmp/openssl-musl/lib64"
        run: |
          cargo build --release --target x86_64-unknown-linux-musl

      - name: Package binary
        run: |
          cd target/x86_64-unknown-linux-musl/release
          strip pqenc
          tar czf pqenc-linux-x86_64.tar.gz pqenc
          sha256sum pqenc-linux-x86_64.tar.gz > pqenc-linux-x86_64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            target/x86_64-unknown-linux-musl/release/pqenc-linux-x86_64.tar.gz
            target/x86_64-unknown-linux-musl/release/pqenc-linux-x86_64.tar.gz.sha256

  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-14  # M1 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          targets: aarch64-apple-darwin

      - name: Install build dependencies
        run: brew install cmake ninja openssl@3

      - name: Cache liboqs
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: /tmp/liboqs-install
          key: liboqs-${{ env.LIBOQS_VERSION }}-macos-arm64-v3

      - name: Build and install liboqs
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.LIBOQS_VERSION }} https://github.com/open-quantum-safe/liboqs.git
          cd liboqs
          mkdir build && cd build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DOQS_USE_OPENSSL=ON \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3) \
            -DCMAKE_INSTALL_PREFIX=/tmp/liboqs-install \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DOQS_ENABLE_KEM_ml_kem_1024=ON \
            -DOQS_DIST_BUILD=ON \
            -DCMAKE_C_FLAGS="-arch arm64" \
            ..
          ninja
          ninja install

      - name: Build pqenc
        run: |
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          export OPENSSL_STATIC=1
          export OPENSSL_DIR=${OPENSSL_PREFIX}
          export OQS_DIR=/tmp/liboqs-install
          export PKG_CONFIG_PATH=/tmp/liboqs-install/lib/pkgconfig:${OPENSSL_PREFIX}/lib/pkgconfig
          export RUSTFLAGS="-C target-feature=+crt-static -L /tmp/liboqs-install/lib -L ${OPENSSL_PREFIX}/lib"
          cargo build --release --target aarch64-apple-darwin

      - name: Package binary
        run: |
          cd target/aarch64-apple-darwin/release
          strip pqenc
          tar czf pqenc-macos-arm64.tar.gz pqenc
          shasum -a 256 pqenc-macos-arm64.tar.gz > pqenc-macos-arm64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            target/aarch64-apple-darwin/release/pqenc-macos-arm64.tar.gz
            target/aarch64-apple-darwin/release/pqenc-macos-arm64.tar.gz.sha256

  build-windows:
    name: Build Windows x86_64
    if: false  # Disabled - uncomment to enable Windows builds
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          targets: x86_64-pc-windows-msvc

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build dependencies
        run: choco install ninja cmake strawberryperl -y

      - name: Cache liboqs
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: C:\liboqs-install
          key: liboqs-${{ env.LIBOQS_VERSION }}-windows-v3

      - name: Build and install liboqs
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl -L https://www.openssl.org/source/openssl-3.0.15.tar.gz -o openssl.tar.gz
          tar xzf openssl.tar.gz
          cd openssl-3.0.15
          perl Configure VC-WIN64A no-shared --prefix=C:\openssl-static
          nmake
          nmake install
          cd ..

          git clone --depth 1 --branch %LIBOQS_VERSION% https://github.com/open-quantum-safe/liboqs.git
          cd liboqs
          mkdir build
          cd build
          cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DOQS_USE_OPENSSL=ON -DOPENSSL_ROOT_DIR=C:\openssl-static -DCMAKE_INSTALL_PREFIX=C:\liboqs-install ..
          ninja
          ninja install

      - name: Build pqenc
        shell: cmd
        env:
          OPENSSL_STATIC: "1"
          OPENSSL_DIR: C:\openssl-static
          OQS_DIR: C:\liboqs-install
          RUSTFLAGS: -C target-feature=+crt-static -L C:\liboqs-install\lib -L C:\openssl-static\lib -l ws2_32 -l advapi32 -l crypt32 -l user32
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package binary
        shell: pwsh
        run: |
          cd target\x86_64-pc-windows-msvc\release
          Compress-Archive -Path pqenc.exe -DestinationPath pqenc-windows-x86_64.zip
          (Get-FileHash pqenc-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower() + "  pqenc-windows-x86_64.zip" | Out-File -Encoding ASCII pqenc-windows-x86_64.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/pqenc-windows-x86_64.zip
            target/x86_64-pc-windows-msvc/release/pqenc-windows-x86_64.zip.sha256

  release:
    name: Create Release
    needs: [build-linux, build-macos-arm64]
    # Add build-windows to needs array when re-enabling Windows builds
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -lR artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true

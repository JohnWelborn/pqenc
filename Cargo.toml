[package]
name = "pqenc"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Post-quantum encryption tool using ML-KEM-1024 (FIPS 203) and AES-256-GCM"
readme = "README.md"
rust-version = "1.95"

[dependencies]
# ML-KEM-1024 (FIPS 203) - formally verified implementation
libcrux-ml-kem = "0.0.10"

# AES-256-GCM
aes-gcm = "0.10"

# Key Derivation
hkdf = "0.13"
sha2 = "0.11"

# Randomness
rand = "0.10"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Encoding
base64 = "0.22"

# Error Handling
anyhow = "1.0"

# Secure Memory
zeroize = { version = "1.8", features = ["derive"] }

# X25519 key exchange (with static_secrets feature for serializable keys)
x25519-dalek = { version = "2.0", features = ["static_secrets", "getrandom", "zeroize"] }

# Passphrase-based key derivation
argon2 = { version = "0.5", features = ["std"] }

# For reading passphrases from terminal
rpassword = "7.5"

# Restoring original file modification/access times on decrypt
filetime = "0.2"

[dev-dependencies]
# Property-based testing
proptest = "1.11"

# Benchmarking
criterion = "0.8"

# Temporary directories for test isolation
tempfile = "3.27"

[[bench]]
name = "crypto_bench"
harness = false

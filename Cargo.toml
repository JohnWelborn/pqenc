[package]
name = "pqenc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Post-quantum encryption tool using ML-KEM-1024 (Kyber) and AES-256-GCM"
readme = "README.md"
rust-version = "1.70"

[dependencies]
# ML-KEM-1024 (Kyber)
oqs = { version = "0.11.0", features = ["kems"] }

# AES-256-GCM
aes-gcm = "0.10.3"

# Key Derivation
hkdf = "0.12.4"
sha2 = "0.10.8"

# Randomness
rand = "0.9"

# CLI
clap = { version = "4.5.4", features = ["derive"] }

# Encoding
base64 = "0.22.1"

# Error Handling
anyhow = "1.0.82"

# Secure Memory
zeroize = { version = "1.7.0", features = ["derive"] }

# X25519 key exchange (with static_secrets feature for serializable keys)
x25519-dalek = { version = "2.0", features = ["static_secrets", "getrandom"] }

# Password-based key derivation
argon2 = { version = "0.5", features = ["std"] }

# For reading passwords from terminal
rpassword = "7.3"

[dev-dependencies]
# Property-based testing
proptest = "1.4"

# Benchmarking
criterion = "0.5"

# Temporary directories for file tests
tempfile = "3.8"

# UUID generation for unique test directories
uuid = { version = "1.6", features = ["v4"] }

[[bench]]
name = "crypto_bench"
harness = false
